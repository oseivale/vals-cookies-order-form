<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="cookieLogoTitle">
  <title id="cookieLogoTitle">Sweet Batch Cookie Co. logo</title>
  <defs>
    <radialGradient id="doughGradient" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#f7c98f" />
      <stop offset="55%" stop-color="#eac394" />
      <stop offset="100%" stop-color="#dba86e" />
    </radialGradient>
  </defs>

  <!-- cookie body -->
  <circle cx="60" cy="60" r="51" fill="url(#doughGradient)" stroke="#996236" stroke-width="3" />

  <!-- soft warm highlight -->
  <ellipse cx="42" cy="38" rx="20" ry="14" fill="#fa945d" opacity="0.18" />

  <!-- chocolate chips -->
  <g fill="#5c3a21">
    <ellipse cx="44" cy="40" rx="7" ry="6" transform="rotate(-18 44 40)" />
    <ellipse cx="78" cy="36" rx="6" ry="5" transform="rotate(24 78 36)" />
    <ellipse cx="61" cy="60" rx="8.5" ry="7" transform="rotate(8 61 60)" />
    <ellipse cx="33" cy="66" rx="5.5" ry="5" transform="rotate(-12 33 66)" />
    <ellipse cx="83" cy="64" rx="6" ry="5" transform="rotate(30 83 64)" />
    <ellipse cx="53" cy="86" rx="7" ry="6" transform="rotate(-22 53 86)" />
    <ellipse cx="80" cy="88" rx="5" ry="4.3" transform="rotate(14 80 88)" />
    <ellipse cx="27" cy="48" rx="4.3" ry="4" transform="rotate(0 27 48)" />
  </g>

  <!-- subtle chip highlights for a little dimension -->
  <g fill="#7a4d2c" opacity="0.55">
    <ellipse cx="42" cy="38.5" rx="2.6" ry="2" transform="rotate(-18 42 38.5)" />
    <ellipse cx="59" cy="58.5" rx="3" ry="2.2" transform="rotate(8 59 58.5)" />
    <ellipse cx="51" cy="84.5" rx="2.6" ry="2" transform="rotate(-22 51 84.5)" />
  </g>
</svg>
